# Relay on Fly (D77, D84). `fly launch --no-deploy` (scripts/deploy-relay-wizard.sh) may rename `app`
# and add primary_region; keep the rest.
app = "sophiel-relay"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/sophiel.db"

[[mounts]]
  source = "sophiel_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
